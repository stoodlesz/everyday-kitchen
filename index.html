<script>
const recipes=[
{id:"gratin",name:"Ninja pasta, ham & broccoli gratin",category:"Ninja Foodi",tags:["Ninja TenderCrisp","Meal prep"],art:"🍲",colour:"orange",time:"40–45 min",serves:5,desc:"Creamy, protein-boosted pasta bake with ham and broccoli.",ingredients:[["Dry fusilli and penne", "5 cups (approx. 475–500g)"],["Schlagsahne","200g"],["Schinken, diced","250g"],["Broccoli florets","2 cups (approx. 200g)"],["Grated cheese","100g"],["Unflavoured Lidl protein powder","2 scoops"],["Kania Nudel-Schinken-Gratin seasoning","2–2½ packets"],["Water","1 litre to start, plus extra if needed"]],steps:["Whisk the seasoning into the cold water and Schlagsahne in a pot. Bring to a gentle boil, stirring.","Reduce the heat. Whisk in the protein powder gradually to prevent lumps.","Add the uncooked pasta. Simmer gently for 7–10 minutes, stirring often, until partially cooked. Add a splash of hot water if the sauce thickens too much.","Add the broccoli and diced Schinken. Simmer for another 2–3 minutes.","Transfer to a Ninja-safe baking dish. Bake on Bake/Roast at 160°C for 15–20 minutes, stirring halfway through.","Add the cheese for the final 10 minutes. Check pasta is tender; stand for 5 minutes before serving."],nutrition:"Per portion (estimated): 680 kcal · Protein 39 g · Carbohydrate 76 g · Fat 23 g · Fibre 5 g · Salt 2.8 g. Packet labels and pasta quantity may change values.",notes:"The pasta cup measure and seasoning amount are estimates. Keep the sauce loose before baking."},
{id:"oats",name:"Carrot cake baked oats",category:"Breakfast",art:"🥕",colour:"yellow",time:"30 min",serves:4,desc:"Warm baked oats with carrot, walnuts and a yoghurt topping.",ingredients:[["Grated carrot","1 medium"],["Rolled oats","1½ cups"],["Chopped walnuts","⅓ cup"],["Baking powder","1 tsp"],["Cinnamon","2 tsp"],["Maple syrup","¼ cup"],["Milk","1 cup"],["Eggs","2"],["Greek yoghurt","2 tbsp (topping)"],["Cream cheese","1 tbsp (topping)"],["Maple syrup","1 tbsp (topping)"]],steps:["Heat the oven to 180°C and grease a baking dish.","Mix the grated carrot, oats, walnuts, baking powder and cinnamon.","Whisk the milk, eggs and maple syrup; stir into the dry ingredients.","Bake for approximately 30 minutes, until set and lightly golden.","Mix the yoghurt, cream cheese and maple syrup for the topping. Serve over the baked oats."],nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"Recipe saved from your earlier version. Adjust the dish size and baking time as needed."},
{id:"carrotoats",name:"Carrot cake baked oats (protein version)",category:"Breakfast",art:"🥣",colour:"blue",time:"35–45 min",serves:6,desc:"A batch-friendly version with banana, protein powder and pecans.",ingredients:[["Ripe bananas, mashed","2–3"],["Eggs","2"],["Milk","¾ cup"],["Greek yoghurt","½ cup"],["Rolled oats","2 cups"],["Vanilla protein powder","2 scoops"],["Grated carrot","1 cup"],["Chopped pecans or walnuts","½ cup"],["Honey or maple syrup","2 tbsp"],["Cinnamon","1 tsp"],["Ground ginger","¼ tsp"],["Nutmeg","¼ tsp"]],steps:["Mash the bananas in a large bowl. Whisk in the eggs, milk, yoghurt and honey or maple syrup.","Stir in the oats, protein powder, grated carrot, nuts and spices. Let the mixture stand for 5 minutes to thicken.","Grease a Ninja-compatible baking tin or heatproof dish that fits inside the cooking pot. Pour in the mixture and level the top.","Select Bake/Roast at 160°C and cook for 25–35 minutes, checking from 25 minutes. It is ready when the centre is set and a skewer comes out without wet batter. If the top browns too quickly, loosely cover with foil (secure it so it cannot touch the heating element).","Rest for 10 minutes before slicing. Mix the Greek yoghurt, cream cheese and maple syrup for a topping if desired."] ,nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"Ninja Foodi Multi-Cooker: Bake/Roast at 160°C for around 25–35 minutes in a suitable tin. Timing varies with dish depth and model; check the centre."}

,{id:"gfchicken",name:"Gluten-free chicken & mushroom pasta bake",category:"Pasta & bakes",tags:["Ninja TenderCrisp","Pasta & bakes","Meal prep","Gluten-free"],art:"🍝",colour:"blue",time:"40–45 min",serves:5,desc:"Creamy chicken, mushrooms and onion with gluten-free pasta, finished with a cheesy bake.",ingredients:[["Diced chicken","500g"],["Gluten-free pasta","400g"],["Mushrooms, sliced","300g"],["White onion, diced","1 (approx. 150g)"],["Garlic, minced","2 cloves (approx. 6g)"],["Chicken stock","300ml"],["Cream","200ml"],["Cream cheese","150g"],["Grated cheese","100g"],["Olive oil","15g (1 tbsp)"],["Paprika","1 tsp"],["Italian herbs","1 tsp"],["Salt and black pepper","To taste"]],steps:["Preheat the oven to 200°C fan.","Heat the olive oil in a large frying pan. Add the diced chicken, paprika, salt and pepper. Cook for 5–7 minutes until browned and cooked through. Remove to a plate.","In the same pan, cook the diced onion and sliced mushrooms for 6–8 minutes until the mushrooms have released their water and started to brown. Add the garlic for the final 30 seconds.","Add the chicken stock, cream and cream cheese. Stir until smooth. Add Italian herbs and black pepper; simmer gently for 3–5 minutes to thicken slightly.","Cook the gluten-free pasta according to packet instructions, removing it 2–3 minutes early while still firm. Drain immediately.","Return the chicken to the sauce and add the pasta. Stir gently to coat. Add a splash of pasta water if the sauce is very thick.","Transfer to a baking dish and top with grated cheese. Bake for 15–18 minutes at 200°C fan until bubbling and golden.","Rest for 5 minutes before serving."],nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"Cook gluten-free pasta just under al dente and combine with the sauce immediately before baking to help prevent it becoming mushy."}
,{id:"cornbread",name:"Broccoli, onion & cheese cornbread",category:"Ninja TenderCrisp",tags:["Ninja TenderCrisp","Gluten-free"],art:"🌽",colour:"yellow",time:"30 min",serves:4,desc:"Savoury maize-flour cornbread with broccoli, softened onion and cheese.",ingredients:[["Maize flour","190g (approx. 1¼ cups)"],["Eggs","2"],["Natural yoghurt","160g (approx. ⅔ cup)"],["Broccoli, small florets","90–100g (approx. 1 cup)"],["White onion, finely diced","75g (½ medium)"],["Grated Gouda or Cheddar","55g (approx. ½ cup)"],["Oil","15g (1 tbsp)"],["Baking soda","1g (¼ tsp)"],["Salt","3g (½ tsp)"],["Black pepper","To taste"],["Water","15–45ml (1–3 tbsp), if needed"]],steps:["Chop the broccoli into small florets. Steam for 2–3 minutes until just tender. Drain thoroughly and cool.","Fry the finely diced onion in a little of the oil for 4–5 minutes until softened. Cool slightly.","Whisk the eggs, yoghurt and remaining oil together.","Gradually whisk in the maize flour until smooth. Add baking soda, salt and black pepper.","Fold in the broccoli, softened onion and grated cheese. If the batter is too thick to stir, add water a tablespoon at a time. It should be thick but spoonable.","Grease an 18cm round baking tin and ensure it fits securely inside the Ninja Foodi.","Bake on BAKE/ROAST at 160°C for 20 minutes. Check the centre with a skewer; if wet batter remains, continue in 3–5 minute increments until set. If your model lacks Bake/Roast, use Air Crisp at 160°C and check the top regularly.","Carefully remove the tin and rest the cornbread for 10 minutes before slicing."],nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"The yoghurt provides acidity for the baking soda. Keep baking soda to ¼ tsp to avoid a soapy taste. Maize flour weight varies by grind; 190g is an approximate cup conversion."}
,{id:"chili",name:"Chilli con carne with rice",category:"Meal prep",tags:["Ninja TenderCrisp","Meal prep","Gluten-free*"],art:"🍛",colour:"orange",time:"45–60 min",serves:6,desc:"Lidl chilli tins, Maggi seasoning and browned mince, reduced thick in the Ninja; rice cooker rice on the side.",ingredients:[["Beef mince","800g"],["Lidl chilli con carne tins","2 × 400g"],["Maggi Chili con Carne seasoning","1 sachet"],["Chopped tomatoes","1 × 400g tin"],["Rice","4 rice-cooker cups"],["Carrots, grated or diced (optional)","3"],["Extra kidney beans (optional)","1 small tin, drained"],["Sweetcorn (optional)","1 small tin, drained"],["Oil","A little, if needed"],["Water","A splash only if needed"]],steps:["Ninja Foodi cooking pot: select Sear/Sauté with the lid open. Add a little oil if needed. Brown the 800g mince, breaking it up; drain excess fat if desired.","Keep using Sear/Sauté with the lid open. Add both Lidl chilli tins, the full Maggi seasoning sachet, chopped tomatoes and optional carrots, kidney beans and sweetcorn. Stir well. Add only a splash of water if needed.","Lower the Sear/Sauté heat and simmer uncovered for 30–45 minutes. Stir every 5–10 minutes, scraping the bottom. Reduce until carrots are soft and sauce is thick.","Optional: if still too liquid, use Bake/Roast at 160°C with the crisping lid closed for 10 minutes. Check and stir carefully; repeat in short intervals if needed.","Separately, cook 4 rice cooker cups of rice using your rice cooker's water instructions. Portion rice and chilli into meal-prep containers."],nutrition:"Estimated per serving (chilli plus 1/6 of 4 rice-cooker cups cooked rice): 650 kcal · Protein 33 g · Carbohydrate 78 g · Fat 22 g · Fibre 9 g · Salt 3.2 g. Highly variable by mince fat %, tin brands, sachet and rice yield. Gluten-free only if all labels (including seasoning) confirm.",notes:"Pressure cooking intentionally avoided: uncovered Sear/Sauté lets moisture evaporate. Maggi sachet is added to the complete mixture; Lidl tins are already seasoned, so salt is brand-dependent."}

,{id:"skyr-mousse",name:"Protein Skyr mousse",category:"Desserts",tags:["Desserts","High-protein"],art:"🍫",colour:"purple",time:"5 min + 15 min chill",serves:1,desc:"Smooth chocolatey Skyr mousse with vanilla protein powder.",ingredients:[["Skyr","150g"],["Vanilla protein powder","15g"],["Milk","A splash (10–20ml)"],["Cocoa powder","1 tsp"],["Sweetener (optional)","To taste"]],steps:["Add Skyr, protein powder, cocoa and a small splash of milk to a bowl.","Whisk until smooth, adding a little more milk if needed.","Taste and add sweetener if desired.","Refrigerate for 15 minutes to thicken, then serve."],nutrition:"Estimated per serving: 190 kcal · Protein 27 g · Carbohydrate 12 g · Fat 2 g · Fibre 2 g · Salt 0.2 g. Depends on Skyr and protein powder labels.",notes:"Use a little milk at a time to keep the mousse thick."}
,{id:"oreo-protein-bowl",name:"Oreo protein cheesecake bowl",category:"Desserts",tags:["Desserts","High-protein"],art:"🍪",colour:"purple",time:"5 min",serves:1,desc:"A quick cheesecake-style Skyr bowl with crushed Oreos.",ingredients:[["Skyr","150g"],["Vanilla protein powder","15g"],["Oreos","2 biscuits, crushed"],["Milk","A splash (10–20ml)"]],steps:["Mix Skyr, protein powder and a splash of milk until creamy.","Crush the Oreos.","Spoon the crushed Oreos over the Skyr mixture and serve."],nutrition:"Estimated per serving: 240 kcal · Protein 25 g · Carbohydrate 25 g · Fat 5 g · Fibre 1 g · Salt 0.4 g. Depends on brands.",notes:"For a softer cookie texture, let the bowl stand for 5 minutes after topping."}
,{id:"protein-brownie",name:"Air fryer protein brownie",category:"Desserts",tags:["Desserts","High-protein","Ninja TenderCrisp"],art:"🍫",colour:"orange",time:"12–18 min",serves:1,desc:"A single-serve chocolate protein brownie, cooked in a small Ninja-safe ramekin.",ingredients:[["Protein powder","20g"],["Egg","1"],["Cocoa powder","10g"],["Oat flour","15g"],["Milk","30ml"],["Sweetener","To taste"],["Baking powder","¼ tsp (optional)"]],steps:["Whisk the egg and milk in a small bowl. Stir in protein powder, cocoa, oat flour, sweetener and optional baking powder until combined.","Spoon into a lightly greased Ninja-safe ramekin. Do not fill more than two-thirds.","Place in the Ninja Foodi. Select Bake/Roast at 160°C with the crisping lid closed for 8 minutes, then check the centre.","Continue in 2-minute increments until just set; avoid overbaking. Rest for 3–5 minutes before eating."],nutrition:"Estimated per serving: 250 kcal · Protein 29 g · Carbohydrate 16 g · Fat 8 g · Fibre 3 g · Salt 0.3 g. Varies by protein powder and oat flour.",notes:"Oat flour is only gluten-free when certified gluten-free. Cooking time varies by ramekin size and Ninja model; ensure the egg is fully cooked."}
,{id:"frozen-skyr-bark",name:"Frozen chocolate Skyr bark",category:"Desserts",tags:["Desserts","High-protein","Gluten-free*"],art:"🍓",colour:"blue",time:"5 min + 2–3 hr freeze",serves:2,desc:"Frozen protein yoghurt bark with cocoa and crushed Oreos.",ingredients:[["Skyr","150g"],["Vanilla protein powder","15g"],["Cocoa powder","1 tsp"],["Oreos, crushed","2 biscuits"],["Sweetener (optional)","To taste"]],steps:["Mix Skyr, protein powder, cocoa and optional sweetener until smooth.","Spread thinly on baking paper or a freezer-safe tray.","Scatter crushed Oreos over the top.","Freeze for 2–3 hours until firm. Break into pieces and serve straight from the freezer."],nutrition:"Estimated per portion (½ batch): 170 kcal · Protein 15 g · Carbohydrate 18 g · Fat 4 g · Fibre 1 g · Salt 0.2 g. Depends on brands.",notes:"Gluten-free only if using certified gluten-free toppings and checking the protein powder label. For strict gluten-free, omit standard Oreos or use a GF alternative."}

];
const categories=["All","Breakfast","Ninja TenderCrisp","Meal prep","Pasta & bakes","Gluten-free","Desserts"];
let active="All", query="", chosen=null, scale=1, currentPage=1;
let shoppingIds=JSON.parse(localStorage.getItem("recipe-shopping-list")||"[]");
const recipesEl=document.getElementById("recipes"), chipsEl=document.getElementById("chips");
document.querySelectorAll(".browse-tile").forEach(tile=>tile.addEventListener("click",()=>{active=tile.dataset.category;currentPage=1;renderChips();renderCards();document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth",block:"start"})}));
document.querySelectorAll(".nav-link").forEach(link=>link.addEventListener("click",()=>{document.getElementById("recipe-browser").style.display="";document.querySelector(".hero").style.display="";document.querySelector(".browse-grid").style.display="";document.getElementById("shopping-view")?.remove();document.querySelectorAll(".nav-link").forEach(x=>x.classList.remove("current"));link.classList.add("current");const view=link.dataset.view;if(view==="home"){active="All";query="";document.getElementById("search").value="";renderChips();renderCards();window.scrollTo({top:0,behavior:"smooth"})}else if(view==="recipes"){document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth"})}else if(view==="mealprep"){active="Meal prep";renderChips();renderCards();document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth"})}else if(view==="shopping"){showShoppingList()}}));
function renderChips(){chipsEl.innerHTML=categories.map(c=>`<button class="chip ${c===active?"active":""}" data-category="${c}">${c}</button>`).join("");chipsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.category;currentPage=1;renderChips();renderCards()})}
function renderCards(){
let list=recipes.filter(r=>(active==="All"||(r.tags||[r.category]).includes(active))&&(`${r.name} ${r.desc} ${r.category} ${r.ingredients.map(x=>x.join(" ")).join(" ")}`).toLowerCase().includes(query.toLowerCase()));
const pageSize=6,totalPages=Math.max(1,Math.ceil(list.length/pageSize));currentPage=Math.min(currentPage,totalPages);
const pageItems=list.slice((currentPage-1)*pageSize,currentPage*pageSize);
document.getElementById("heading").textContent=active==="All"?"All recipes":active;
document.getElementById("count").textContent=`${list.length} ${list.length===1?"recipe":"recipes"}`;
recipesEl.innerHTML=pageItems.length?pageItems.map(r=>`<article class="card" data-id="${r.id}"><div class="card-art ${r.colour}"><span class="tag">${(r.tags||[r.category]).map(t=>`<span class="tag-pill">${t}</span>`).join(" ")}</span><button class="shop-btn ${shoppingIds.includes(r.id)?"is-added":""}" aria-label="Add to shopping list" title="Add to shopping list" data-shop="${r.id}">${shoppingIds.includes(r.id)?"✓ Listed":"＋ Shopping list"}</button><span class="dish">${r.art}</span></div><div class="card-body"><h3>${r.name}</h3><div class="desc">${r.desc}</div><div class="meta"><span><strong>${r.time}</strong></span><span>Serves <strong>${r.serves}</strong></span></div></div></article>`).join(""):`<div class="empty">No recipes found. Try another search.</div>`;
const pager=document.getElementById("pagination");
pager.innerHTML=totalPages>1?`<button data-page="${currentPage-1}" ${currentPage===1?"disabled":""}>← Previous</button>${Array.from({length:totalPages},(_,i)=>`<button class="${currentPage===i+1?"active":""}" data-page="${i+1}">${i+1}</button>`).join("")}<button data-page="${currentPage+1}" ${currentPage===totalPages?"disabled":""}>Next →</button>`:"";
pager.querySelectorAll("button").forEach(b=>b.onclick=()=>{currentPage=Number(b.dataset.page);renderCards();document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth",block:"start"})});
recipesEl.querySelectorAll(".card").forEach(c=>c.onclick=()=>openRecipe(c.dataset.id));
recipesEl.querySelectorAll(".shop-btn").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleShopping(b.dataset.shop);renderCards()})
}
function toggleShopping(id){shoppingIds=shoppingIds.includes(id)?shoppingIds.filter(x=>x!==id):[...shoppingIds,id];localStorage.setItem("recipe-shopping-list",JSON.stringify(shoppingIds))}
function showShoppingList(){document.getElementById("recipe-browser").style.display="none";document.querySelector(".hero").style.display="none";document.querySelector(".browse-grid").style.display="none";let el=document.getElementById("shopping-view");if(!el){el=document.createElement("section");el.id="shopping-view";el.className="shopping-view";document.querySelector("main").appendChild(el)}const selected=recipes.filter(r=>shoppingIds.includes(r.id));const items=selected.flatMap(r=>r.ingredients.map(([name,qty])=>({name,qty,recipe:r.name})));el.innerHTML=`<div class="section-head"><h2>Shopping List</h2><span class="count">${selected.length} recipes selected</span></div>${selected.length?`<p>Ingredients from the recipes you've added.</p><ul class="shopping-items">${items.map(i=>`<li><span>${i.qty} ${i.name}</span><small>${i.recipe}</small></li>`).join("")}</ul><button class="chip active" id="download-shopping">Download shopping list</button><button class="chip" id="clear-shopping">Clear list</button>`:`<p>Your shopping list is empty. Add recipes using “＋ Shopping list”.</p>`}`;document.getElementById("download-shopping")?.addEventListener("click",()=>{const text="EVERYDAY KITCHEN — SHOPPING LIST\\n\\n"+items.map(i=>`${i.qty} ${i.name} — ${i.recipe}`).join("\\n");downloadText(text,"everyday-kitchen-shopping-list.txt")});document.getElementById("clear-shopping")?.addEventListener("click",()=>{shoppingIds=[];localStorage.setItem("recipe-shopping-list","[]");showShoppingList()})}
function downloadText(text,name){const blob=new Blob([text],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function downloadRecipePDF(r){const content=`<h1>${r.name}</h1><p>${r.desc}</p><h2>Ingredients</h2><ul>${r.ingredients.map(([n,q])=>`<li>${q} ${n}</li>`).join("")}</ul><h2>Method</h2><ol>${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol><h2>Nutrition</h2><p>${r.nutrition}</p>`;const w=window.open("","_blank");w.document.write(`<html><head><title>${r.name}</title><style>body{font:16px Arial;max-width:760px;margin:35px auto;line-height:1.5}h1,h2{color:#473151}li{margin:8px 0}@media print{button{display:none}}\n.tag{display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 90px)}.tag-pill{display:inline-block;flex:0 0 auto;padding:5px 8px;border:1px solid #6d526d;background:#211624;color:#f28b35;font-size:9px;line-height:1.2;letter-spacing:1px;border-radius:0;white-space:nowrap}.shop-btn,.modal-shop,.pdf-btn{position:absolute;right:12px;top:12px;background:#17111f;color:#f0e2d9;border:1px solid #6d526d;font:11px ui-monospace,monospace;padding:7px;cursor:pointer;z-index:2}.modal-shop,.pdf-btn{position:static;display:inline-block;margin:10px 8px 10px 0}.pdf-btn{color:#f28b35}.shopping-items{list-style:none;padding:0}.shopping-items li{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px}.shopping-items small{color:var(--muted)}\n</style></head><body>${content}<button onclick="window.print()">Save as PDF / Print</button></body></html>`);w.document.close()}
function openRecipe(id){chosen=recipes.find(r=>r.id===id);scale=1;drawModal();document.getElementById("backdrop").classList.add("open")}
function drawModal(){let r=chosen;document.getElementById("modal").innerHTML=`<button class="close" aria-label="Close recipe">×</button><button class="modal-shop" id="modal-shop">${shoppingIds.includes(r.id)?"✓ Added to shopping list":"＋ Add to shopping list"}</button><button class="pdf-btn" id="pdf-recipe">Download PDF</button><div class="detail-hero"><div class="eyebrow">${r.category} · ${r.time}</div><h2>${r.name}</h2><p>${r.desc}</p></div><div class="detail-content"><section><h3>Ingredients</h3><div class="serves">Portions <button id="minus">−</button><strong>${Math.round(r.serves*scale)}</strong><button id="plus">+</button></div><ul class="ingredients">${r.ingredients.map(([name,qty])=>`<li><label><input type="checkbox"><span>${scaleQty(qty,scale)} ${name}</span></label></li>`).join("")}</ul><div class="notes"><label for="note">Your kitchen notes</label><textarea id="note" placeholder="What would you change next time?">${localStorage.getItem("note-"+r.id)||r.notes||""}</textarea></div></section><section><h3>Method</h3><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="notes"><label>Nutrition</label><p style="font-size:14px;line-height:1.6;color:#72786b">${r.nutrition}</p></div></section></div>`;document.querySelector(".close").onclick=closeModal;document.getElementById("modal-shop").onclick=()=>{toggleShopping(r.id);drawModal()};document.getElementById("pdf-recipe").onclick=()=>downloadRecipePDF(r);document.getElementById("minus").onclick=()=>{scale=Math.max(.5,scale-.5);drawModal()};document.getElementById("plus").onclick=()=>{scale=Math.min(4,scale+.5);drawModal()};document.getElementById("note").onchange=e=>localStorage.setItem("note-"+r.id,e.target.value)}
function scaleQty(q,s){if(s===1)return q;const m=q.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return q+" × "+s;return (Number(m[1])*s).toLocaleString("en-GB",{maximumFractionDigits:2})+m[2]}
function closeModal(){document.getElementById("backdrop").classList.remove("open")}
