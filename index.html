<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Everyday Kitchen</title>
<style>
:root{--paper:#f6f2e9;--ink:#252c22;--muted:#72786b;--green:#354d3b;--sage:#dce4d5;--orange:#c66a42;--line:#ded9ce;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:-.7px}.brand span{color:var(--orange)}
.topnote{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
main{max-width:1300px;margin:auto;padding:36px clamp(18px,5vw,72px) 80px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:stretch}
.hero-copy{padding:28px 0}.eyebrow{color:var(--orange);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
h1{font:clamp(44px,6vw,76px)/.98 Georgia,serif;letter-spacing:-2.7px;margin:16px 0 20px;max-width:700px}
.hero p{font-size:16px;line-height:1.7;color:var(--muted);max-width:520px}
.hero-art{min-height:290px;border-radius:20px;background:linear-gradient(140deg,#e6d6b9,#c9d5bf);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.plate{width:235px;height:235px;border-radius:50%;background:#fff9ed;border:13px solid #e8e0d1;box-shadow:0 18px 30px #52634a22;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
.pasta{font-size:88px;filter:saturate(.8)}.art-label{position:absolute;bottom:20px;right:20px;background:var(--white);padding:10px 14px;border-radius:99px;font:italic 15px Georgia,serif}
.toolbar{margin:36px 0 22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--white);padding:14px 18px;border-radius:12px;font:inherit;outline-color:var(--green)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}.chip.active,.chip:hover{background:var(--green);color:white;border-color:var(--green)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 16px}.section-head h2{font:30px Georgia,serif;margin:0}.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #2c34251a}
.card-art{height:180px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--sage);overflow:hidden}.card-art:before{content:"";width:180px;height:180px;border-radius:50%;background:#ffffff66;position:absolute}.card-art .dish{font-size:65px;position:relative;filter:saturate(.78)}.card-art.orange{background:#eed8c7}.card-art.yellow{background:#e9e1bc}.card-art.blue{background:#d7e1df}
.tag{position:absolute;top:13px;left:13px;background:#fffdf8e8;padding:6px 9px;border-radius:99px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--green);font-weight:700}
.card-body{padding:17px 18px 19px}.fav-btn,.modal-fav{position:absolute;right:12px;top:12px;background:#17111f;color:#f28b35;border:1px solid #493454;font-size:22px;cursor:pointer;padding:3px 9px;z-index:2}.fav-btn.is-fav,.modal-fav{color:#ff9a43}.modal-fav{position:static;margin:8px 12px 0 auto;display:block;font-size:14px}.card h3{font:24px Georgia,serif;margin:0 0 8px;letter-spacing:-.4px}.desc{font-size:13px;line-height:1.5;color:var(--muted);min-height:39px}.meta{display:flex;gap:14px;margin-top:16px;font-size:12px;color:var(--muted)}.meta strong{color:var(--ink);font-weight:600}
.empty{padding:50px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{padding:25px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.modal-backdrop{position:fixed;inset:0;background:#1e251dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.open{display:flex}
.modal{background:var(--white);width:min(850px,100%);max-height:92vh;overflow:auto;border-radius:20px;position:relative}.close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;border:0;background:#e9e5dc;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer;z-index:2}
.detail-hero{padding:34px 38px 24px;background:var(--sage)}.detail-hero h2{font:clamp(32px,5vw,48px) Georgia,serif;margin:12px 0}.detail-hero p{color:#5f6b5b;line-height:1.6;max-width:620px}.detail-content{padding:26px 38px 38px;display:grid;grid-template-columns:.8fr 1.2fr;gap:34px}
.detail-content h3{font:24px Georgia,serif;margin:0 0 16px}.serves{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px}.serves button{border:1px solid var(--line);background:white;border-radius:8px;padding:5px 10px;cursor:pointer}.ingredients{list-style:none;padding:0;margin:0}.ingredients li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}.ingredients input{accent-color:var(--green);margin-right:9px}.ingredients li:has(input:checked){color:var(--muted);text-decoration:line-through}
.steps{padding-left:20px;margin:0}.steps li{padding:0 0 15px 6px;line-height:1.65;font-size:14px}.notes{margin-top:20px}.notes label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px;font:14px inherit;background:#fff}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero-art{min-height:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-content{grid-template-columns:1fr}}
@media(max-width:560px){header{padding:18px}.topnote{display:none}main{padding-top:22px}.hero-copy{padding:12px 0}.hero-art{min-height:190px}.grid{grid-template-columns:1fr}.card-art{height:155px}.detail-hero,.detail-content{padding:24px}.section-head h2{font-size:26px}}

/* Witchy, low-fi pixel kitchen theme */
:root{--paper:#17111f;--ink:#f0e8f6;--muted:#b4a5c4;--green:#68418b;--sage:#2b2038;--orange:#f28b35;--line:#493454;--white:#21182b}

.chip.active,.chip:hover{background:#68418b;border-color:#f28b35}

.card-art{background:linear-gradient(135deg,#21182b,#2b2038 55%,#21182b)!important;border-bottom:1px solid #493454}

.fav-btn,.modal-fav{position:absolute;right:12px;top:12px;background:#17111f;color:#f28b35;border:1px solid #493454;font-size:22px;cursor:pointer;padding:3px 9px;z-index:2}.fav-btn.is-fav,.modal-fav{color:#ff9a43}.modal-fav{position:static;margin:8px 12px 0 auto;display:block;font-size:14px}.card h3{color:#f0e8f6}
footer{border-color:var(--line);color:var(--muted)}
.modal-backdrop{background:#0b0710e8}
.modal{background:#21182b;border:2px solid #493454;border-radius:0}
.close{background:#493454;color:#f0e8f6;border-radius:0}
.detail-hero{background:#2b2038;border-bottom:2px solid #493454}
.detail-hero p{color:#c6b4d7}
.detail-content h3{color:#f28b35}
.serves button{background:#17111f;color:var(--ink);border-color:var(--line);border-radius:0}
.ingredients li{border-color:var(--line)}

/* Layout matched to the pixel-art homepage mock-up */
.site-header{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 18px 18px;border:0}

<div class="recipe-browser" id="recipe-browser"><div class="toolbar"><div class="search"><input id="search" type="search" placeholder="Search recipes or ingredients…" aria-label="Search recipes"></div><div class="chips" id="chips"></div></div>

<script>
const recipes=[
{id:"gratin",name:"Ninja pasta, ham & broccoli gratin",category:"Ninja Foodi",tags:["Ninja TenderCrisp","Meal prep"],art:"🍲",colour:"orange",time:"40–45 min",serves:5,desc:"Creamy, protein-boosted pasta bake with ham and broccoli.",ingredients:[["Dry fusilli and penne", "5 cups (approx. 475–500g)"],["Schlagsahne","200g"],["Schinken, diced","250g"],["Broccoli florets","2 cups (approx. 200g)"],["Grated cheese","100g"],["Unflavoured Lidl protein powder","2 scoops"],["Kania Nudel-Schinken-Gratin seasoning","2–2½ packets"],["Water","1 litre to start, plus extra if needed"]],steps:["Whisk the seasoning into the cold water and Schlagsahne in a pot. Bring to a gentle boil, stirring.","Reduce the heat. Whisk in the protein powder gradually to prevent lumps.","Add the uncooked pasta. Simmer gently for 7–10 minutes, stirring often, until partially cooked. Add a splash of hot water if the sauce thickens too much.","Add the broccoli and diced Schinken. Simmer for another 2–3 minutes.","Transfer to a Ninja-safe baking dish. Bake on Bake/Roast at 160°C for 15–20 minutes, stirring halfway through.","Add the cheese for the final 10 minutes. Check pasta is tender; stand for 5 minutes before serving."],nutrition:"Per portion (estimated): 680 kcal · Protein 39 g · Carbohydrate 76 g · Fat 23 g · Fibre 5 g · Salt 2.8 g. Packet labels and pasta quantity may change values.",notes:"The pasta cup measure and seasoning amount are estimates. Keep the sauce loose before baking."},
{id:"oats",name:"Carrot cake baked oats",category:"Breakfast",art:"🥕",colour:"yellow",time:"30 min",serves:4,desc:"Warm baked oats with carrot, walnuts and a yoghurt topping.",ingredients:[["Grated carrot","1 medium"],["Rolled oats","1½ cups"],["Chopped walnuts","⅓ cup"],["Baking powder","1 tsp"],["Cinnamon","2 tsp"],["Maple syrup","¼ cup"],["Milk","1 cup"],["Eggs","2"],["Greek yoghurt","2 tbsp (topping)"],["Cream cheese","1 tbsp (topping)"],["Maple syrup","1 tbsp (topping)"]],steps:["Heat the oven to 180°C and grease a baking dish.","Mix the grated carrot, oats, walnuts, baking powder and cinnamon.","Whisk the milk, eggs and maple syrup; stir into the dry ingredients.","Bake for approximately 30 minutes, until set and lightly golden.","Mix the yoghurt, cream cheese and maple syrup for the topping. Serve over the baked oats."],nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"Recipe saved from your earlier version. Adjust the dish size and baking time as needed."},
{id:"carrotoats",name:"Carrot cake baked oats (protein version)",category:"Breakfast",art:"🥣",colour:"blue",time:"35–45 min",serves:6,desc:"A batch-friendly version with banana, protein powder and pecans.",ingredients:[["Ripe bananas, mashed","2–3"],["Eggs","2"],["Milk","¾ cup"],["Greek yoghurt","½ cup"],["Rolled oats","2 cups"],["Vanilla protein powder","2 scoops"],["Grated carrot","1 cup"],["Chopped pecans or walnuts","½ cup"],["Honey or maple syrup","2 tbsp"],["Cinnamon","1 tsp"],["Ground ginger","¼ tsp"],["Nutmeg","¼ tsp"]],steps:["Mash the bananas in a large bowl. Whisk in the eggs, milk, yoghurt and honey or maple syrup.","Stir in the oats, protein powder, grated carrot, nuts and spices. Let the mixture stand for 5 minutes to thicken.","Grease a Ninja-compatible baking tin or heatproof dish that fits inside the cooking pot. Pour in the mixture and level the top.","Select Bake/Roast at 160°C and cook for 25–35 minutes, checking from 25 minutes. It is ready when the centre is set and a skewer comes out without wet batter. If the top browns too quickly, loosely cover with foil (secure it so it cannot touch the heating element).","Rest for 10 minutes before slicing. Mix the Greek yoghurt, cream cheese and maple syrup for a topping if desired."] ,nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"Ninja Foodi Multi-Cooker: Bake/Roast at 160°C for around 25–35 minutes in a suitable tin. Timing varies with dish depth and model; check the centre."}

,{id:"gfchicken",name:"Gluten-free chicken & mushroom pasta bake",category:"Pasta & bakes",tags:["Ninja TenderCrisp","Pasta & bakes","Meal prep","Gluten-free"],art:"🍝",colour:"blue",time:"40–45 min",serves:5,desc:"Creamy chicken, mushrooms and onion with gluten-free pasta, finished with a cheesy bake.",ingredients:[["Diced chicken","500g"],["Gluten-free pasta","400g"],["Mushrooms, sliced","300g"],["White onion, diced","1 (approx. 150g)"],["Garlic, minced","2 cloves (approx. 6g)"],["Chicken stock","300ml"],["Cream","200ml"],["Cream cheese","150g"],["Grated cheese","100g"],["Olive oil","15g (1 tbsp)"],["Paprika","1 tsp"],["Italian herbs","1 tsp"],["Salt and black pepper","To taste"]],steps:["Preheat the oven to 200°C fan.","Heat the olive oil in a large frying pan. Add the diced chicken, paprika, salt and pepper. Cook for 5–7 minutes until browned and cooked through. Remove to a plate.","In the same pan, cook the diced onion and sliced mushrooms for 6–8 minutes until the mushrooms have released their water and started to brown. Add the garlic for the final 30 seconds.","Add the chicken stock, cream and cream cheese. Stir until smooth. Add Italian herbs and black pepper; simmer gently for 3–5 minutes to thicken slightly.","Cook the gluten-free pasta according to packet instructions, removing it 2–3 minutes early while still firm. Drain immediately.","Return the chicken to the sauce and add the pasta. Stir gently to coat. Add a splash of pasta water if the sauce is very thick.","Transfer to a baking dish and top with grated cheese. Bake for 15–18 minutes at 200°C fan until bubbling and golden.","Rest for 5 minutes before serving."],nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"Cook gluten-free pasta just under al dente and combine with the sauce immediately before baking to help prevent it becoming mushy."}
,{id:"cornbread",name:"Broccoli, onion & cheese cornbread",category:"Ninja TenderCrisp",tags:["Ninja TenderCrisp","Gluten-free"],art:"🌽",colour:"yellow",time:"30 min",serves:4,desc:"Savoury maize-flour cornbread with broccoli, softened onion and cheese.",ingredients:[["Maize flour","190g (approx. 1¼ cups)"],["Eggs","2"],["Natural yoghurt","160g (approx. ⅔ cup)"],["Broccoli, small florets","90–100g (approx. 1 cup)"],["White onion, finely diced","75g (½ medium)"],["Grated Gouda or Cheddar","55g (approx. ½ cup)"],["Oil","15g (1 tbsp)"],["Baking soda","1g (¼ tsp)"],["Salt","3g (½ tsp)"],["Black pepper","To taste"],["Water","15–45ml (1–3 tbsp), if needed"]],steps:["Chop the broccoli into small florets. Steam for 2–3 minutes until just tender. Drain thoroughly and cool.","Fry the finely diced onion in a little of the oil for 4–5 minutes until softened. Cool slightly.","Whisk the eggs, yoghurt and remaining oil together.","Gradually whisk in the maize flour until smooth. Add baking soda, salt and black pepper.","Fold in the broccoli, softened onion and grated cheese. If the batter is too thick to stir, add water a tablespoon at a time. It should be thick but spoonable.","Grease an 18cm round baking tin and ensure it fits securely inside the Ninja Foodi.","Bake on BAKE/ROAST at 160°C for 20 minutes. Check the centre with a skewer; if wet batter remains, continue in 3–5 minute increments until set. If your model lacks Bake/Roast, use Air Crisp at 160°C and check the top regularly.","Carefully remove the tin and rest the cornbread for 10 minutes before slicing."],nutrition:"Per portion (estimated): 390 kcal · Protein 13 g · Carbohydrate 49 g · Fat 17 g · Fibre 5 g · Salt 0.6 g.",notes:"The yoghurt provides acidity for the baking soda. Keep baking soda to ¼ tsp to avoid a soapy taste. Maize flour weight varies by grind; 190g is an approximate cup conversion."}
,{id:"chili",name:"Chilli con carne with rice",category:"Meal prep",tags:["Ninja TenderCrisp","Meal prep","Gluten-free*"],art:"🍛",colour:"orange",time:"45–60 min",serves:6,desc:"Lidl chilli tins, Maggi seasoning and browned mince, reduced thick in the Ninja; rice cooker rice on the side.",ingredients:[["Beef mince","800g"],["Lidl chilli con carne tins","2 × 400g"],["Maggi Chili con Carne seasoning","1 sachet"],["Chopped tomatoes","1 × 400g tin"],["Rice","4 rice-cooker cups"],["Carrots, grated or diced (optional)","3"],["Extra kidney beans (optional)","1 small tin, drained"],["Sweetcorn (optional)","1 small tin, drained"],["Oil","A little, if needed"],["Water","A splash only if needed"]],steps:["Ninja Foodi cooking pot: select Sear/Sauté with the lid open. Add a little oil if needed. Brown the 800g mince, breaking it up; drain excess fat if desired.","Keep using Sear/Sauté with the lid open. Add both Lidl chilli tins, the full Maggi seasoning sachet, chopped tomatoes and optional carrots, kidney beans and sweetcorn. Stir well. Add only a splash of water if needed.","Lower the Sear/Sauté heat and simmer uncovered for 30–45 minutes. Stir every 5–10 minutes, scraping the bottom. Reduce until carrots are soft and sauce is thick.","Optional: if still too liquid, use Bake/Roast at 160°C with the crisping lid closed for 10 minutes. Check and stir carefully; repeat in short intervals if needed.","Separately, cook 4 rice cooker cups of rice using your rice cooker's water instructions. Portion rice and chilli into meal-prep containers."],nutrition:"Estimated per serving (chilli plus 1/6 of 4 rice-cooker cups cooked rice): 650 kcal · Protein 33 g · Carbohydrate 78 g · Fat 22 g · Fibre 9 g · Salt 3.2 g. Highly variable by mince fat %, tin brands, sachet and rice yield. Gluten-free only if all labels (including seasoning) confirm.",notes:"Pressure cooking intentionally avoided: uncovered Sear/Sauté lets moisture evaporate. Maggi sachet is added to the complete mixture; Lidl tins are already seasoned, so salt is brand-dependent."}

];
const categories=["All","Breakfast","Ninja TenderCrisp","Meal prep","Pasta & bakes","Gluten-free","Desserts","Favourites"];
let active="All", query="", chosen=null, scale=1;
let favourites=JSON.parse(localStorage.getItem("recipe-favourites")||"[]");
const recipesEl=document.getElementById("recipes"), chipsEl=document.getElementById("chips");
document.querySelectorAll(".browse-tile").forEach(tile=>tile.addEventListener("click",()=>{active=tile.dataset.category;renderChips();renderCards();document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth",block:"start"})}));
document.querySelectorAll(".nav-link").forEach(link=>link.addEventListener("click",()=>{document.querySelectorAll(".nav-link").forEach(x=>x.classList.remove("current"));link.classList.add("current");const view=link.dataset.view;if(view==="home"){active="All";query="";document.getElementById("search").value="";renderChips();renderCards();window.scrollTo({top:0,behavior:"smooth"})}else if(view==="recipes"){document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth"})}else if(view==="mealprep"){active="Meal prep";renderChips();renderCards();document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth"})}else if(view==="favourites"){active="Favourites";renderChips();renderCards();document.getElementById("recipe-browser").scrollIntoView({behavior:"smooth"})}}));
function renderChips(){chipsEl.innerHTML=categories.map(c=>`<button class="chip ${c===active?"active":""}" data-category="${c}">${c}</button>`).join("");chipsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.category;renderChips();renderCards()})}
function renderCards(){let list=recipes.filter(r=>(active==="All"||(active==="Favourites"?favourites.includes(r.id):(r.tags||[r.category]).includes(active)))&&(`${r.name} ${r.desc} ${r.category} ${r.ingredients.map(x=>x.join(" ")).join(" ")}`).toLowerCase().includes(query.toLowerCase()));document.getElementById("heading").textContent=active==="All"?"All recipes":active;document.getElementById("count").textContent=`${list.length} ${list.length===1?"recipe":"recipes"}`;recipesEl.innerHTML=list.length?list.map(r=>`<article class="card" data-id="${r.id}"><div class="card-art ${r.colour}"><span class="tag">${(r.tags||[r.category]).join(" · ")}</span><button class="fav-btn ${favourites.includes(r.id)?"is-fav":""}" aria-label="Toggle favourite" title="Favourite" data-fav="${r.id}">${favourites.includes(r.id)?"★":"☆"}</button><span class="dish">${r.art}</span></div><div class="card-body"><h3>${r.name}</h3><div class="desc">${r.desc}</div><div class="meta"><span><strong>${r.time}</strong></span><span>Serves <strong>${r.serves}</strong></span></div></div></article>`).join(""):`<div class="empty">No recipes found. Try another search.</div>`;recipesEl.querySelectorAll(".card").forEach(c=>c.onclick=()=>openRecipe(c.dataset.id));recipesEl.querySelectorAll(".fav-btn").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav;favourites=favourites.includes(id)?favourites.filter(x=>x!==id):[...favourites,id];localStorage.setItem("recipe-favourites",JSON.stringify(favourites));renderCards()})}
function openRecipe(id){chosen=recipes.find(r=>r.id===id);scale=1;drawModal();document.getElementById("backdrop").classList.add("open")}
function drawModal(){let r=chosen;document.getElementById("modal").innerHTML=`<button class="close" aria-label="Close recipe">×</button><button class="modal-fav" id="modal-fav">${favourites.includes(r.id)?"★ Favourite":"☆ Favourite"}</button><div class="detail-hero"><div class="eyebrow">${r.category} · ${r.time}</div><h2>${r.name}</h2><p>${r.desc}</p></div><div class="detail-content"><section><h3>Ingredients</h3><div class="serves">Portions <button id="minus">−</button><strong>${Math.round(r.serves*scale)}</strong><button id="plus">+</button></div><ul class="ingredients">${r.ingredients.map(([name,qty])=>`<li><label><input type="checkbox"><span>${scaleQty(qty,scale)} ${name}</span></label></li>`).join("")}</ul><div class="notes"><label for="note">Your kitchen notes</label><textarea id="note" placeholder="What would you change next time?">${localStorage.getItem("note-"+r.id)||r.notes||""}</textarea></div></section><section><h3>Method</h3><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="notes"><label>Nutrition</label><p style="font-size:14px;line-height:1.6;color:#72786b">${r.nutrition}</p></div></section></div>`;document.querySelector(".close").onclick=closeModal;document.getElementById("modal-fav").onclick=()=>{favourites=favourites.includes(r.id)?favourites.filter(x=>x!==r.id):[...favourites,r.id];localStorage.setItem("recipe-favourites",JSON.stringify(favourites));drawModal()};document.getElementById("minus").onclick=()=>{scale=Math.max(.5,scale-.5);drawModal()};document.getElementById("plus").onclick=()=>{scale=Math.min(4,scale+.5);drawModal()};document.getElementById("note").onchange=e=>localStorage.setItem("note-"+r.id,e.target.value)}
function scaleQty(q,s){if(s===1)return q;const m=q.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return q+" × "+s;return (Number(m[1])*s).toLocaleString("en-GB",{maximumFractionDigits:2})+m[2]}
function closeModal(){document.getElementById("backdrop").classList.remove("open")}
document.getElementById("backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});document.getElementById("search").oninput=e=>{query=e.target.value;renderCards()};
renderChips();renderCards();
</script>
</body></html>
